name: Build test branch

on:
  push:
    branches: [local]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check command args
        run: python3 .github/scripts/check_command_args.py

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build
        run: ./gradlew spotlessCheck :fakeplayer-dist:shadowJar --build-cache --configuration-cache --parallel --console=plain -Dorg.gradle.workers.max=2

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: fakeplayer-dist/build/libs/*.jar
          archive: false
          if-no-files-found: error
          retention-days: 14
