name: Build test branch

on:
  push:
    branches: [test-no-dimension-hop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew :fakeplayer-dist:shadowJar --build-cache --parallel --console=plain

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/*.jar
          archive: false
          if-no-files-found: error
          if-no-files-found: error
          retention-days: 14
